; =============================================================================
; duodx.ini - DuoDX configuration file
; Full documentation: SDR_Recorder_Guide.docx
; Lines starting with ; are comments. CLI arguments override these values.
; =============================================================================

; -- Output -------------------------------------------------------------------
recording_path  =                 ; Directory for recordings. Leave blank for
                                  ; current directory. Example: E:\Recordings\
output_file     = recording.raw   ; Leave as "recording.raw" to auto-generate a
                                  ; timestamped name: YYYYMMDD_HHMMSSZ_<freq>kHz.raw
output_format   = linrad          ; linrad | wavviewdx | sdruno | sdrconnect
; log_file      = duodx.log       ; Uncomment to enable logging to a file.

; -- Device -------------------------------------------------------------------
; device_serial =                 ; Leave blank for first device found.
                                  ; Set to serial number to select a specific device.

; -- Receiver -----------------------------------------------------------------
frequency_mhz   = 0.875           ; Centre frequency (MHz).
antenna         = A               ; RSPdx/R2: A | B | C  RSP2: A | B
                                  ; RSPduo Tuner 1: 50ohm | Hi-Z
gain_reduction  = 40              ; Gain reduction dB (20-59). Higher = less gain.
lna_state       = 0               ; LNA attenuation state (0 = max sensitivity).
agc_enable      = 0               ; AGC: 0=off (recommended for DXing) | 1=on
dc_correct      = 1               ; DC offset correction (1=on recommended).
iq_correct      = 1               ; IQ imbalance correction (1=on recommended).
notch_rf        = 0               ; RF notch filter (FM broadcast): 1=on
notch_dab       = 0               ; DAB notch filter: 1=on
bias_t          = 0               ; Bias-T power on antenna port: 1=on
hiz_notch       = 0               ; RSPduo Hi-Z AM notch: 1=on (Hi-Z port only)

; -- Sample rate and IF -------------------------------------------------------
sample_rate_msps = 6.0            ; ADC sample rate.
if_khz          = 1620            ; IF frequency: 0 | 1620 | 2048
bw_khz          = 1536            ; IF bandwidth. Must be 1536 for Low-IF mode.
ppm             = 0.0             ; Frequency correction ppm. 0.0 with GPSDO.

; Valid sample rate / IF / bandwidth combinations:
;   if_khz=0,    bw_khz=1536, sample_rate_msps=2  -> 2 Msps out  (Zero-IF)
;   if_khz=1620, bw_khz=1536, sample_rate_msps=6  -> 2 Msps out  (recommended)
;   if_khz=1620, bw_khz=1536, sample_rate_msps=8  -> 2 Msps out
;   if_khz=2048, bw_khz=1536, sample_rate_msps=8  -> 2 Msps out

; -- HDR mode (RSPdx / RSPdx R2 only) ----------------------------------------
hdr_enable      = 0               ; High Dynamic Range mode: 1=on (below 2 MHz)
hdr_bw_khz      = 1700            ; HDR bandwidth: 200 | 500 | 1200 | 1700
                                  ; Valid HDR centre frequencies (kHz):
                                  ;   135, 175, 220, 250, 340, 475, 516,
                                  ;   875, 1125, 1900

; -- Dual channel (RSPduo only) -----------------------------------------------
dual_channel    = 0               ; 1=enable RSPduo dual-tuner mode
freq_b_mhz      = 1.125           ; Tuner B centre frequency (dual mode only).
; gain_reduction_b = 40           ; Tuner B gain reduction dB
; lna_state_b      = 0            ; Tuner B LNA state
; agc_enable_b     = 0            ; Tuner B AGC (0=off, 1=on)
; dc_correct_b     = 1            ; Tuner B DC offset correction
; iq_correct_b     = 1            ; Tuner B IQ imbalance correction
; notch_rf_b       = 0            ; Tuner B RF notch filter
; notch_dab_b      = 0            ; Tuner B DAB notch filter
                                  ; Leave Tuner B settings commented to inherit
                                  ; the same value as Tuner A.

; -- Recording ----------------------------------------------------------------
duration_sec    = 0               ; Recording duration seconds. 0=unlimited.
decimation      = 1               ; Software decimation: 1 | 2 | 4 | 8 | 16 | 32
ring_buffer_sec = 4               ; Ring buffer size seconds. Increase if overflows.
monitor_interval_ms = 500         ; Status line update interval: 200 | 500 | 1000 ms
spinup_enable   = 1               ; Wake a spinning disk before recording (1=on).
spinup_bytes    = 1 MB            ; Spin-up write size: 1 MB = 7200 RPM drives
                                  ; 4 MB = slow portables / NAS  8 MB = stubborn drives

; -- Remote monitoring --------------------------------------------------------
http_port       = 8080            ; HTTP status monitor port. 0=disabled.
                                  ; Open http://<this-pc-ip>:<port>/ in a browser.
                                  ; Firewall rule (run as Administrator):
                                  ;   netsh advfirewall firewall add rule
                                  ;   name="DuoDX" dir=in action=allow
                                  ;   protocol=TCP localport=8080
http_interval_ms = 2000           ; Dashboard refresh interval ms (500-30000).
                                  ; Use 5000-10000 for overnight to save battery.

; -- Named pipe (real-time IQ stream) -----------------------------------------
pipe_enable     = 0               ; 1=create named pipe for real-time monitoring.
pipe_name       = \\.\pipe\duodx  ; Compatible clients: SDR#, HDSDR, GNU Radio.

; -- Misc ---------------------------------------------------------------------
verbose         = 0               ; 0=normal | 1=verbose (gain change events etc.)

; =============================================================================
; Multi-recording schedule
; =============================================================================
; schedule_only = 0  Single recording mode. Uses top-level settings above.
;                    Set start_time_utc to delay the start, or leave blank
;                    to begin immediately. Schedule entries below are ignored.
;
; schedule_only = 1  Scheduled mode. DuoDX always waits for scheduled times -
;                    instant recording is disabled. If a start time has already
;                    passed today, it waits until that time tomorrow.
;                    Recommended for unattended overnight recordings.
;
; start_time_utc     Only used when schedule_only = 0. Delays a single
;                    recording until this UTC time. Format: HH:MM:SS.
;                    Leave blank to start immediately.
;
; Schedule entry keys (N = 1, 2, 3, ...):
;   schedule_N_start_time  = HH:MM:SS   UTC start time
;   schedule_N_duration    = seconds    Recording duration
;   schedule_N_frequency   = MHz        Tuner A centre frequency
;   schedule_N_freq_b      = MHz        Tuner B centre frequency (dual mode only)
;   schedule_N_antenna     = A|B|C      Antenna input (blank = keep current)
;   schedule_N_output_file = filename   Output filename (blank = auto-generate)

schedule_only   = 0
schedule_repeat = 0               ; 1=repeat schedule nightly. After all entries
                                  ; finish, DuoDX reloads the schedule and waits
                                  ; for schedule_1_start_time the following day.
                                  ; Only works when schedule_only = 1.
start_time_utc  =

schedule_1_start_time  = 09:00:00
schedule_1_duration    = 3600
schedule_1_frequency   = 0.875
schedule_1_antenna     = A
schedule_1_output_file =

schedule_2_start_time  = 10:00:00
schedule_2_duration    = 3600
schedule_2_frequency   = 0.875
schedule_2_antenna     = A
schedule_2_output_file =
